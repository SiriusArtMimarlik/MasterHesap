name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Şantiye Aletlerini İndir
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev libffi-dev libssl-dev python3-dev zip unzip openjdk-17-jdk autoconf libtool automake
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: Buildozer ile APK Üret
        run: buildozer android debug

      - name: APK'yı Çıktı Olarak Ver
        uses: actions/upload-artifact@v4
        with:
          name: MasterHesap-APK
          path: bin/*.apk
