name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodları Kopyala
        uses: actions/checkout@v4

      - name: Resmi Kivy Buildozer Kapsülü ile İnşa Et
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: APK'yı Sistemi Yükle ve Teslim Et
        uses: actions/upload-artifact@v4
        with:
          name: MasterHesap-APK
          path: bin/*.apk
